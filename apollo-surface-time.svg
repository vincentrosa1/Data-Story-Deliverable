<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" arialabeledby="chart-title chart-desc" preserveAspectRation="xMidYMid meet" font-family="Aria, Helveticca, sans-serif">
<style>
    .graphic-surface{fill:#0a1526;}
    .graphic-primary{fill:#0b3d91;}
    .graphic-accent{fill:#ffcc33;}
    .graphic-gridline{stroke:#31445e;stroke-width:1.5;stroke-dasharray:6 8;}
    .graphic-axis{fill:#9aa9be;font-size:15px;}
    .graphic-label{fill:#e8edf5;font-size:18px;font-weight:700;}
    .graphic-value{fill:#e8edf5;font-size:16px;font-weight:700;}
</style>
 <title id="chart-title">Apollo lunar surface stay time by mission, 1969 to 1972</title>
  <desc id="chart-desc">Horizontal bar chart. Surface stay time rises from 21.6 hours on Apollo 11 to 75 hours on Apollo 17: Apollo 11 21.6, Apollo 12 31.5, Apollo 14 33.5, Apollo 15 66.9, Apollo 16 71.0, Apollo 17 75.0 hours.</desc>

  <rect class="graphic-surface" x="0" y="0" width="900" height="500"/>


  <g class="graphic-gridline">
    <line x1="170" y1="60" x2="170" y2="430"/>
    <line x1="330" y1="60" x2="330" y2="430"/>
    <line x1="490" y1="60" x2="490" y2="430"/>
    <line x1="650" y1="60" x2="650" y2="430"/>
    <line x1="810" y1="60" x2="810" y2="430"/>
  </g>
  <g class="graphic-axis" text-anchor="middle">
    <text x="170" y="455">0</text>
    <text x="330" y="455">20</text>
    <text x="490" y="455">40</text>
    <text x="650" y="455">60</text>
    <text x="810" y="455">80</text>
    <text x="490" y="482">Lunar surface stay time (hours)</text>
  </g>


  <g>
    <rect class="graphic-primary" x="170" y="70" width="172.8" height="40"/>
    <rect class="graphic-primary" x="170" y="130" width="252" height="40"/>
    <rect class="graphic-primary" x="170" y="190" width="268" height="40"/>
    <rect class="graphic-primary" x="170" y="250" width="535.2" height="40"/>
    <rect class="graphic-primary" x="170" y="310" width="568" height="40"/>
    <rect class="graphic-accent" x="170" y="370" width="600" height="40"/>
  </g>

 
  <g class="graphic-label" text-anchor="end">
    <text x="158" y="97">Apollo 11</text>
    <text x="158" y="157">Apollo 12</text>
    <text x="158" y="217">Apollo 14</text>
    <text x="158" y="277">Apollo 15</text>
    <text x="158" y="337">Apollo 16</text>
    <text x="158" y="397">Apollo 17</text>
  </g>


  <g class="graphic-value">
    <text x="352" y="97">21.6 h</text>
    <text x="432" y="157">31.5 h</text>
    <text x="448" y="217">33.5 h</text>
    <text x="715" y="277">66.9 h</text>
    <text x="748" y="337">71.0 h</text>
    <text x="780" y="397">75.0 h</text>
  </g>
</svg>